name: Docker Build and Push

# Builds linux/arm64 images (every homelab node is arm64) natively on ubuntu-24.04-arm.
# QEMU is not used: emulated arm64 `npm ci` crashed with SIGILL under qemu v10.2.3 and the
# build then hung until it was cancelled.
# Runs on a component/vX.Y.Z tag push. workflow_dispatch rebuilds an existing tag
# (component + version), for example after a failed build; it checks out that tag.
on:
  push:
    tags:
      # Match tags like backend/v1.2.3 and frontend/v1.2.3
      - "*/v*.*.*"
  workflow_dispatch:
    inputs:
      component:
        description: Image to build
        required: true
        type: choice
        options:
          - backend
          - frontend
      version:
        description: Existing release version without the leading v (for example 0.13.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  extract-component:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.tag-prefix.outputs.component }}
      version: ${{ steps.tag-prefix.outputs.version }}
      tag: ${{ steps.tag-prefix.outputs.tag }}
    steps:
      - name: Extract component from tag
        id: tag-prefix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COMPONENT: ${{ inputs.component }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="${INPUT_COMPONENT}/v${INPUT_VERSION}"
          else
            # Extract tag from GITHUB_REF (refs/tags/frontend/v0.0.2 -> frontend/v0.0.2)
            TAG_NAME=${GITHUB_REF#refs/tags/}
          fi
          echo "Full tag: $TAG_NAME"

          # Check if tag matches expected pattern (component/v*.*.*)
          if [[ $TAG_NAME =~ ^(backend|frontend)/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Extract component name (everything before the first /)
            COMPONENT=${TAG_NAME%%/*}
            echo "Extracted component: $COMPONENT"
            echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
            # backend/v0.12.0 -> 0.12.0, baked into the image as its reported version
            echo "version=${TAG_NAME#*/v}" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Tag '$TAG_NAME' does not match expected pattern 'backend/v*.*.*' or 'frontend/v*.*.*'"
            exit 1
          fi

  docker:
    runs-on: ubuntu-24.04-arm
    needs: extract-component
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.extract-component.outputs.tag }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/${{ needs.extract-component.outputs.component }}
          # Image tags drop the component prefix: 0.13.0, 0.13, 0, sha-<short>
          tags: |
            type=semver,pattern={{version}},value=${{ needs.extract-component.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.extract-component.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.extract-component.outputs.version }}
            type=sha

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ needs.extract-component.outputs.component }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # New scope: the old multi-arch cache was written by QEMU builds.
          cache-from: type=gha,scope=${{ needs.extract-component.outputs.component }}-arm64
          cache-to: type=gha,mode=max,scope=${{ needs.extract-component.outputs.component }}-arm64
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            APP_VERSION=${{ needs.extract-component.outputs.version }}
            VITE_APP_VERSION=${{ needs.extract-component.outputs.version }}
