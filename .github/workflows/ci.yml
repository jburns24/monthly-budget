name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  pre-commit:
    name: Lint & Format (pre-commit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install backend dependencies
        run: |
          cd backend
          # --locked matches backend/Dockerfile, which builds with `uv sync
          # --locked` in both stages. A bare `uv sync` would silently re-lock a
          # pyproject/uv.lock mismatch here and let the PR pass while the
          # release build hard-fails on it.
          uv sync --locked

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run pre-commit on all files
        uses: pre-commit/action@v3.0.1
        env:
          # Needed so local hooks (ruff, eslint, prettier, tsc) can find their binaries
          SKIP: ""

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: monthly_budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://budget:budget@localhost:5432/monthly_budget
          SECRET_KEY: ci-test-secret-key
          # conftest signs test JWTs with settings.jwt_secret when it is >= 32
          # chars, while the app verifies with the same setting. Unset, both
          # sides fall out of sync and every authenticated request 401s.
          JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long # pragma: allowlist secret
          ENVIRONMENT: test
        run: |
          uv sync --locked
          # The service container starts empty and conftest.py never creates the
          # schema, so the tables have to exist before the first test connects.
          uv run alembic upgrade head
          uv run pytest

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Run frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
