# Alembic migration Job.
#
# IMMUTABILITY / TILT NOTE
# ------------------------
# A Job's `spec.template` and `spec.selector` are immutable once created, so a
# plain `kubectl apply` over a changed Job fails with:
#   "field is immutable"
# Tilt handles this for us: it detects Job objects whose spec has changed and
# does a delete + recreate rather than an apply, so every `tilt up` / image
# rebuild re-runs the migration against the fresh image.
#
# The name is kept STABLE (`backend-migrate`, no hash suffix) so the Tiltfile
# can reference it directly, e.g.:
#   k8s_resource('backend-migrate', resource_deps=['postgres'])
#   k8s_resource('backend', resource_deps=['backend-migrate'])
#
# To re-run it by hand outside Tilt:
#   kubectl -n monthly-budget delete job backend-migrate --ignore-not-found
#   kustomize build manifests/overlays/dev | kubectl apply -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  labels:
    app.kubernetes.io/name: backend-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  # No ttlSecondsAfterFinished: keep the completed Job (and its pod logs)
  # around so Tilt and `kubectl logs job/backend-migrate` can show them.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "waiting for postgres..."
                sleep 2
              done
              echo "postgres is accepting connections"
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      containers:
        - name: migrate
          # Same placeholder as the backend Deployment so Tilt rewrites both
          # from the single docker_build('monthly-budget-backend', ...).
          image: monthly-budget-backend
          imagePullPolicy: IfNotPresent
          # alembic/env.py reads the URL from app settings (DATABASE_URL), and
          # alembic.ini lives at /app/alembic.ini -- which is the image WORKDIR.
          workingDir: /app
          command:
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
