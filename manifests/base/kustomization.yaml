apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifests for the monthly-budget local k8s dev stack.
#
# The base intentionally contains NO ConfigMap/Secret objects. Every workload
# pulls its configuration via `envFrom` against two fixed names -- `app-config`
# and `app-secrets` -- which an overlay is expected to supply (the dev overlay
# does so with configMapGenerator/secretGenerator + disableNameSuffixHash).
# Building this base on its own therefore renders valid YAML but the workloads
# would not start; always build an overlay.

resources:
  - namespace.yaml
  - postgres
  - redis
  - backend
  - frontend
  - ingress

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: monthly-budget
